name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/Customer.Api.sln

      - name: Build
        run: dotnet build src/Customer.Api.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test src/Customer.Api.sln --no-build --configuration Release --verbosity normal
