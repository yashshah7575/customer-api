# LOCAL DEVELOPMENT / DEMONSTRATION ONLY.
# Demo admin credentials and realm secrets are throwaway values. Do not use them in production.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    # start-dev uses Keycloak's built-in development store. Recreate the container to re-import the realm.

  api:
    profiles: ["api"]
    build:
      context: ./src
      dockerfile: Customer.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Authentication__Authority: http://host.docker.internal:8080/realms/customer-api-demo
      Authentication__Audience: customer-api
      Authentication__RequireHttpsMetadata: "false"
    ports:
      - "5080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - keycloak
